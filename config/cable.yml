# Action Cable (WebSocket for the Driver app and the Convoy App, see .api-documents/integration.md § WebSocket).
# Development runs in one process (async). Production uses Redis so a broadcast from any Puma worker, job or host
# reaches every connection (accessory "redis" in config/deploy.yml).
development:
  adapter: async

test:
  adapter: test

production:
  adapter: redis
  url: <%= ENV.fetch("REDIS_URL", "redis://localhost:6379/1") %>
  channel_prefix: convoy_v3_production
