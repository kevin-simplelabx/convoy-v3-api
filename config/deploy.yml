# Staging deploy with Kamal 2 (https://kamal-deploy.org). Guide: .notes/deploy.md
service: convoy_v3
image: kevin-simplelabx/convoy-v3-api

servers:
  web:
    - 13.229.92.162
  # Split Solid Queue out of Puma when jobs grow:
  # job:
  #   hosts:
  #     - 13.229.92.162
  #   cmd: bin/jobs

ssh:
  user: deployer

# Fewer parallel SSH connections: dropped handshakes count as sshd PerSourcePenalties (see .notes/deploy.md).
sshkit:
  max_concurrent_starts: 5

# kamal-proxy terminates SSL (Let's Encrypt) in front of the app.
proxy:
  ssl: true
  host: convoy-api-staging.convoy.sg
  app_port: 80
  healthcheck:
    path: /up

# GitHub Container Registry (private package ghcr.io/kevin-simplelabx/convoy-v3-api): the Mac pushes, the server pulls
# straight from GitHub. Token: classic PAT with write:packages in .kamal/registry_token.
registry:
  server: ghcr.io
  username: kevin-simplelabx
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64

env:
  secret:
    - RAILS_MASTER_KEY
    - CONVOY_V3_DATABASE_PASSWORD
    - ROUTING_SECRET
  clear:
    DB_HOST: convoy_v3-db
    APP_HOST: convoy-api-staging.convoy.sg
    SOLID_QUEUE_IN_PUMA: true
    WEB_CONCURRENCY: 2
    # FE runs from localhost (any port) and mobile apps while the team tests.
    CORS_ALLOW_LOCALHOST: true
    # Firebase Hosting front ends (Transport Company web app and the other staging web apps)
    CORS_ORIGINS: https://convoy-v3-transport-company.web.app
    # Staging only: the Client Portal sign-in code is returned as dev_code until SMTP is set up. Never in production.
    PORTAL_SHOW_CODE: 1
    # Staging only: seeds / live_map:simulate may write sample GPS data (Live Map, Ops Control). Never in production.
    SAMPLE_DATA: 1
    # School Bus routing engine (accessory "routing" below)
    ROUTING_URL: http://convoy_v3-routing:4000

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"
  seed: app exec --reuse "bin/rails db:seed"

# CarrierWave uploads (private files) survive deploys.
volumes:
  - "convoy_v3_storage:/rails/storage"

accessories:
  db:
    image: postgres:17
    host: 13.229.92.162
    # Only reachable from the server itself (use an SSH tunnel to connect from your Mac).
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: convoy_v3
        POSTGRES_DB: convoy_v3_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
  # School Bus routing engine (routing-service/, Node). Image built and pushed by bin/routing-image; internal only.
  routing:
    image: ghcr.io/kevin-simplelabx/convoy-routing:latest
    host: 13.229.92.162
    env:
      clear:
        PORT: 4000
        OSRM_URL: https://router.project-osrm.org
        SOLVE_CONCURRENCY: 1
        MAX_EFFORT: high
      secret:
        - ROUTING_SECRET
